function App() {
  const [drivers, setDriversRaw] = useState([]);
  const [logs, setLogsRaw] = useState([]);
  const [rewardConfig, setRewardConfig] = useState(DEFAULT_REWARD_CONFIG);
  const [redemptions, setRedemptions] = useState({});
  const [quests, setQuests] = useState([]);
  const [archives, setArchives] = useState([]);
  const [incidents, setIncidents] = useState([]); // เหตุการณ์ความปลอดภัย (แยกจากระบบดาว)
  const [staffPin, setStaffPin] = useState(STAFF_PIN); // PIN ปัจจุบัน (แก้ได้จากหลังบ้าน เก็บที่ Firebase: settings/staffPin)
  const [levelCosts, setLevelCosts] = useState(DEFAULT_LEVEL_COSTS); // ดาวของแต่ละขั้น (แก้ได้จากหลังบ้าน: settings/levelCosts)
  const [settingsReady, setSettingsReady] = useState(false);
  const [loading, setLoading] = useState(true);
  const [role, setRole] = useState(null);
  const [currentDriverId, setCurrentDriverId] = useState(null);
  const [view, setView] = useState("home");

  // โหมดกลางวัน/กลางคืน — จำค่าไว้ในเครื่องของแต่ละคน (ไม่ sync ข้ามเครื่อง เพราะเป็นความชอบส่วนตัว)
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("sts_theme") || "day"; } catch (e) { return "day"; }
  });
  const toggleTheme = () => {
    setTheme((prev) => {
      const next = prev === "day" ? "night" : "day";
      try { localStorage.setItem("sts_theme", next); } catch (e) {}
      return next;
    });
  };
  const themeClass = theme === "night" ? "theme-night" : "theme-day";

  // เชื่อมต่อ Firebase Realtime Database แบบ live (push อัปเดตทันทีไม่ต้อง polling)
  useEffect(() => {
    if (!isFirebaseConfigured || !db) { setLoading(false); return; }

    const driversRef = db.ref("drivers");
    const logsRef = db.ref("logs");
    const rewardConfigRef = db.ref("rewardConfig");
    const redemptionsRef = db.ref("redemptions");
    const questsRef = db.ref("quests");
    const archivesRef = db.ref("archives");
    const settingsRef = db.ref("settings");
    const incidentsRef = db.ref("incidents");

    driversRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const seedObj = {};
        DRIVER_SEED.forEach((d) => { seedObj[d.id] = d; });
        driversRef.set(seedObj);
      }
    });
    logsRef.once("value").then((snap) => {
      if (!snap.exists()) {
        const seedObj = {};
        seedLogs().forEach((l, i) => { seedObj[`seed_${i}`] = l; });
        logsRef.set(seedObj);
      }
    });
    rewardConfigRef.once("value").then((snap) => {
      if (!snap.exists()) rewardConfigRef.set(DEFAULT_REWARD_CONFIG);
    });

    const onDrivers = driversRef.on("value", (snap) => {
      const val = snap.val() || {};
      setDriversRaw(Object.values(val));
      setLoading(false);
    });
    const onLogs = logsRef.on("value", (snap) => {
      const val = snap.val() || {};
      setLogsRaw(Object.keys(val).map((k) => ({ ...val[k], id: k })));
    });
    const onRewardConfig = rewardConfigRef.on("value", (snap) => {
      const val = snap.val();
      setRewardConfig(val || DEFAULT_REWARD_CONFIG);
    });
    const onRedemptions = redemptionsRef.on("value", (snap) => {
      setRedemptions(snap.val() || {});
    });
    const onQuests = questsRef.on("value", (snap) => {
      const val = snap.val() || {};
      setQuests(Object.keys(val).map((k) => ({ ...val[k], id: k })));
    });
    const onArchives = archivesRef.on("value", (snap) => {
      const val = snap.val() || {};
      setArchives(
        Object.keys(val)
          .map((k) => ({ ...val[k], id: k }))
          .sort((a, b) => (a.archivedAt < b.archivedAt ? 1 : -1))
      );
    });

    const onIncidents = incidentsRef.on("value", (snap) => {
      const val = snap.val() || {};
      setIncidents(Object.keys(val).map((k) => ({ ...val[k], id: k })));
    });
    const onSettings = settingsRef.on(
      "value",
      (snap) => {
        const v = snap.val() || {};
        setStaffPin(v.staffPin ? String(v.staffPin) : STAFF_PIN);
        setLevelCosts(applyLevelCosts(v.levelCosts));
        setSettingsReady(true);
      },
      () => setSettingsReady(true)
    );

    return () => {
      incidentsRef.off("value", onIncidents);
      settingsRef.off("value", onSettings);
      driversRef.off("value", onDrivers);
      logsRef.off("value", onLogs);
      rewardConfigRef.off("value", onRewardConfig);
      redemptionsRef.off("value", onRedemptions);
      questsRef.off("value", onQuests);
      archivesRef.off("value", onArchives);
    };
  }, []);

  const persistRewardConfig = (updater) => {
    setRewardConfig((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (db) db.ref("rewardConfig").set(next).catch(() => {});
      return next;
    });
  };

  function redeemReward(driverId, levelId, choice, tokensSpent) {
    if (!db) return;
    db.ref(`redemptions/${driverId}`).push({ levelId, choice, redeemedAt: new Date().toISOString(), tokensSpent: Number(tokensSpent) || 0, status: "pending" });
  }

  // เจ้าหน้าที่กด "รับของแล้ว" (หรือย้อนกลับเป็นรอรับ) — ไม่กระทบโทเคน/ดาวของคนขับ
  function markRedemptionPicked(driverId, redemptionKey, picked) {
    if (!db) return;
    db.ref(`redemptions/${driverId}/${redemptionKey}`).update(
      picked ? { status: "picked", pickedAt: new Date().toISOString() } : { status: "pending", pickedAt: null }
    );
  }

  // เหตุการณ์ความปลอดภัย: เขียนที่ node "incidents" เท่านั้น ไม่แตะ logs/redemptions
  function addIncident(data) {
    if (db) db.ref("incidents").push({ ...data, createdAt: new Date().toISOString() });
  }
  function updateIncident(id, data) {
    if (db) db.ref(`incidents/${id}`).update({ ...data, updatedAt: new Date().toISOString() });
  }
  function deleteIncident(id) {
    if (db) db.ref(`incidents/${id}`).remove();
  }
  function clearIncidents() {
    if (db) db.ref("incidents").set({});
  }

  function saveLevelCosts(costs) {
    if (!db) return Promise.reject(new Error("no db"));
    return db.ref("settings/levelCosts").set(costs);
  }

  function changeStaffPin(newPin) {
    if (!db) return Promise.reject(new Error("no db"));
    return db.ref("settings/staffPin").set(String(newPin));
  }

  function cancelRedemption(driverId, redemptionKey) {
    if (!db) return;
    db.ref(`redemptions/${driverId}/${redemptionKey}`).remove();
  }

  function resetAllRedemptions() {
    if (db) db.ref("redemptions").set({});
  }

  const persistDrivers = (updater) => {
    setDriversRaw((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (db) {
        const obj = {};
        next.forEach((d) => { obj[d.id] = d; });
        db.ref("drivers").set(obj).catch(() => {});
      }
      return next;
    });
  };

  function addStar(driverId, type, amount, reason, questId) {
    const entry = { driverId, type, amount, reason, date: todayStr(), givenBy: "หัวหน้างาน" };
    if (questId) entry.questId = questId;
    if (db) db.ref("logs").push(entry);
  }

  function updateLog(logId, updates) {
    if (db) db.ref(`logs/${logId}`).update(updates);
  }

  function deleteLog(logId) {
    if (db) db.ref(`logs/${logId}`).remove();
  }

  function resetAllStars() {
    if (db) db.ref("logs").set({});
  }

  // เก็บประวัติปีปัจจุบันไว้ดูย้อนหลัง แล้วเริ่มปีใหม่ (ล้างดาว+โทเคน แต่ไม่ลบรายชื่อคนขับ/เควส)
  function archiveAndResetYear(label) {
    if (!db) return;
    const breakdownByDriver = {};
    drivers.forEach((d) => {
      const t = totalsByDriver[d.id] || { total: 0 };
      breakdownByDriver[d.id] = {
        id: d.id,
        name: d.name,
        plate: d.plate,
        unit: d.unit || "",
        total: t.total || 0,
        ppe: t.ppe || 0,
        safety: t.safety || 0,
        activity: t.activity || 0,
        quiz: t.quiz || 0,
        special: t.special || 0,
      };
    });
    const totalStarsGiven = logs.reduce((s, l) => s + (Number(l.amount) || 0), 0);
    const topDrivers = Object.values(breakdownByDriver)
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);
    const snapshot = {
      label: label || String(new Date().getFullYear()),
      archivedAt: new Date().toISOString(),
      driverCount: drivers.length,
      logCount: logs.length,
      totalStarsGiven,
      drivers: breakdownByDriver,
      topDrivers,
      redemptions: redemptions || {},
    };
    db.ref("archives")
      .push(snapshot)
      .then(() => {
        db.ref("logs").set({});
        db.ref("redemptions").set({});
      });
  }

  // เควสกิจกรรม: แม่แบบการให้ดาวที่แอดมินตั้งชื่อ/ประเภทดาว/จำนวนดาวเองได้ล่วงหน้า
  function addQuest(name, type, amount) {
    if (db) db.ref("quests").push({ name, type, amount: Number(amount) || 0, createdAt: new Date().toISOString() });
  }

  function updateQuest(questId, updates) {
    if (db) db.ref(`quests/${questId}`).update(updates);
  }

  function deleteQuest(questId) {
    if (db) db.ref(`quests/${questId}`).remove();
  }

  // ซ่อมข้อมูลเก่า: รายการดาวที่เคยให้ผ่านเควสก่อนที่ระบบจะผูก questId ไว้ (เหตุผลตรงกับชื่อเควสเป๊ะๆ) ให้เชื่อมย้อนหลัง
  function backfillQuestLinks() {
    if (!db) return;
    const updates = {};
    let count = 0;
    logs.forEach((l) => {
      if (l.questId) return;
      const match = quests.find((q) => q.name === l.reason);
      if (match) {
        updates[`logs/${l.id}/questId`] = match.id;
        count++;
      }
    });
    if (count === 0) {
      window.alert('ไม่พบรายการดาวเก่าที่ตรงกับชื่อเควสที่มีอยู่ตอนนี้ (ต้องมี "เหตุผล" ตรงกับชื่อเควสเป๊ะๆ)');
      return;
    }
    if (window.confirm(`พบ ${count} รายการดาวเก่าที่ตรงกับชื่อเควสปัจจุบัน ต้องการเชื่อมโยงเข้ากับเควสเพื่อให้นับจำนวนคนได้ดาวถูกต้องหรือไม่?`)) {
      db.ref().update(updates).then(() => window.alert(`เชื่อมโยงสำเร็จ ${count} รายการ`));
    }
  }

  const totalsByDriver = useMemo(() => {
    const map = {};
    drivers.forEach((d) => {
      const mine = logs.filter((l) => l.driverId === d.id);
      const t = { total: 0 };
      STAR_ORDER.forEach((k) => (t[k] = 0));
      mine.forEach((l) => { t[l.type] += l.amount; t.total += l.amount; });
      map[d.id] = t;
    });
    return map;
  }, [logs, drivers]);

  const todayByDriver = useMemo(() => {
    const map = {};
    drivers.forEach((d) => {
      map[d.id] = logs.filter((l) => l.driverId === d.id && l.date === todayStr()).reduce((s, l) => s + l.amount, 0);
    });
    return map;
  }, [logs, drivers]);

  // โทเคนดาวสำหรับแลกรางวัล = ดาวสะสมทั้งหมด (ถาวร) ลบด้วยโทเคนที่เคยใช้แลกไปแล้ว
  // ดาวสะสม (totalsByDriver) ไม่ถูกตัดเลย ใช้ตัดสิน Safety Hero ประจำปีแยกต่างหาก
  const tokensByDriver = useMemo(() => {
    const map = {};
    drivers.forEach((d) => {
      const total = (totalsByDriver[d.id] || { total: 0 }).total;
      const mySpent = Object.values(redemptions[d.id] || {}).reduce((s, r) => s + (Number(r.tokensSpent) || 0), 0);
      map[d.id] = Math.max(0, total - mySpent);
    });
    return map;
  }, [drivers, totalsByDriver, redemptions]);

  const leaderboard = useMemo(() => {
    return drivers.map((d) => ({ ...d, total: (totalsByDriver[d.id] || { total: 0 }).total })).sort((a, b) => b.total - a.total);
  }, [drivers, totalsByDriver]);

  const todayTotalAll = useMemo(() => logs.filter((l) => l.date === todayStr()).reduce((s, l) => s + l.amount, 0), [logs]);

  // ตรวจจับตอนคนขับเลื่อนแรงค์ใหม่ เพื่อโชว์ป๊อปอัปฉลอง (เทียบกับแรงค์ล่าสุดที่จำไว้ในเครื่อง)
  const [levelUpInfo, setLevelUpInfo] = useState(null);
  useEffect(() => {
    if (!currentDriverId) return;
    const total = (totalsByDriver[currentDriverId] || { total: 0 }).total;
    const level = getLevel(total);
    const storageKey = `sts_level_${currentDriverId}`;
    let prevLevelId = null;
    try { prevLevelId = localStorage.getItem(storageKey); } catch (e) {}
    // ถ้ายังไม่เคยบันทึกไว้ในเครื่องนี้เลย ให้ถือว่าเดิมอยู่แรงค์ต่ำสุด (lvl0)
    // เพื่อให้เห็นป๊อปอัปฉลองได้แม้เพิ่งเปิดแอปครั้งแรกแต่ดาวสะสมพอจะขึ้นแรงค์แล้ว (เช่น กรณีทดสอบให้ดาวก่อนเปิดหน้าคนขับ)
    const prevIdx = prevLevelId ? LEVELS.findIndex((l) => l.id === prevLevelId) : 0;
    const currentIdx = LEVELS.findIndex((l) => l.id === level.id);
    if (currentIdx > prevIdx) {
      setLevelUpInfo(level);
    }
    try { localStorage.setItem(storageKey, level.id); } catch (e) {}
  }, [currentDriverId, totalsByDriver, levelCosts]);

  // ประวัติการแลกของปีก่อนๆ (ที่ถูกเก็บไว้ตอนปิดรอบปี) ของคนขับคนนี้
  const pastRedemptionsOf = (driverId) => {
    const out = [];
    (archives || []).forEach((a) => {
      const mine = (a.redemptions && a.redemptions[driverId]) || {};
      Object.keys(mine).forEach((k) => out.push({ ...mine[k], key: `${a.id}-${k}`, yearLabel: a.label }));
    });
    return out;
  };

  const exitToLogin = () => { setRole(null); setCurrentDriverId(null); setView("home"); };
  const backToStaffMenu = () => { setCurrentDriverId(null); setRole("staffMenu"); };

  if (!isFirebaseConfigured) return <FirebaseSetupNeeded />;
  if (loading || !settingsReady) return <LoadingScreen />;

  if (!role) return <LoginView staffPin={staffPin} drivers={drivers} onEnter={(r, id) => { setRole(r); setCurrentDriverId(id); }} theme={theme} onToggleTheme={toggleTheme} />;

  if (role === "staffMenu") return <StaffMenuScreen onSelectRole={(r) => setRole(r)} onExit={exitToLogin} />;

  if (role === "tv") return <LeaderboardTV leaderboard={leaderboard} todayTotalAll={todayTotalAll} exit={backToStaffMenu} />;

  if (role === "admin") return <AdminView drivers={drivers} setDrivers={persistDrivers} logs={logs} addStar={addStar} exit={exitToLogin} onBack={backToStaffMenu} onResetStars={resetAllStars} rewardConfig={rewardConfig} setRewardConfig={persistRewardConfig} redemptions={redemptions} onCancelRedemption={cancelRedemption} onMarkRedemptionPicked={markRedemptionPicked} staffPin={staffPin} onChangeStaffPin={changeStaffPin} levelCosts={levelCosts} onSaveLevelCosts={saveLevelCosts} onResetRedemptions={resetAllRedemptions} onUpdateLog={updateLog} onDeleteLog={deleteLog} quests={quests} onAddQuest={addQuest} onUpdateQuest={updateQuest} onDeleteQuest={deleteQuest} onBackfillQuestLinks={backfillQuestLinks} archives={archives} onArchiveAndResetYear={archiveAndResetYear} incidents={incidents} onAddIncident={addIncident} onUpdateIncident={updateIncident} onDeleteIncident={deleteIncident} onClearIncidents={clearIncidents} theme={theme} onToggleTheme={toggleTheme} />;

  if (role === "supervisor") return <SupervisorView drivers={drivers} logs={logs} leaderboard={leaderboard} incidents={incidents} exit={exitToLogin} onBack={backToStaffMenu} theme={theme} onToggleTheme={toggleTheme} />;

  const driver = drivers.find((d) => d.id === currentDriverId);
  if (!driver) return <LoginView staffPin={staffPin} drivers={drivers} onEnter={(r, id) => { setRole(r); setCurrentDriverId(id); }} theme={theme} onToggleTheme={toggleTheme} />;
  const totals = totalsByDriver[currentDriverId] || { total: 0, ppe: 0, safety: 0, activity: 0, quiz: 0, special: 0 };
  const todayTotal = todayByDriver[currentDriverId] || 0;
  const tokens = tokensByDriver[currentDriverId] || 0;

  return (
    <div className={`sts-light ${themeClass}`} style={{ maxWidth: 480, margin: "0 auto", position: "relative" }}>
      {view === "home" && <DriverHome driver={driver} totals={totals} tokens={tokens} todayTotal={todayTotal} setView={setView} exit={exitToLogin} theme={theme} onToggleTheme={toggleTheme} />}
      {view === "mystar" && <MyStar totals={totals} setView={setView} theme={theme} onToggleTheme={toggleTheme} />}
      {view === "history" && <History logs={logs} driverId={currentDriverId} setView={setView} theme={theme} onToggleTheme={toggleTheme} />}
      {view === "reward" && <RankView totals={totals} tokens={tokens} setView={setView} driverId={currentDriverId} rewardConfig={rewardConfig} myRedemptionHistory={redemptions[currentDriverId] || {}} pastRedemptions={pastRedemptionsOf(currentDriverId)} onRedeem={redeemReward} theme={theme} onToggleTheme={toggleTheme} />}
      {view === "incidents" && <IncidentsView incidents={incidents.filter((i) => i.driverId === currentDriverId)} setView={setView} theme={theme} onToggleTheme={toggleTheme} />}
      <BottomNav view={view} setView={setView} />
      {levelUpInfo && <LevelUpCelebration level={levelUpInfo} onClose={() => setLevelUpInfo(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- PWA: ลงทะเบียน service worker + ปุ่มติดตั้งแอปลอย -->
<script>
  (function () {
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    var deferredPrompt = null;
    var installBtn = null;

    function showInstallButton() {
      if (installBtn) return;
      installBtn = document.createElement("button");
      installBtn.textContent = "📲 ติดตั้งแอปนี้";
      installBtn.style.cssText =
        "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;" +
        "background:#FFC531;color:#0B0D0F;border:none;border-radius:999px;" +
        "padding:10px 20px;font-family:'Kanit',sans-serif;font-size:14px;font-weight:600;" +
        "box-shadow:0 4px 14px rgba(0,0,0,0.35);cursor:pointer;";
      installBtn.onclick = function () {
        if (!deferredPrompt) return;
        installBtn.style.display = "none";
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
        });
      };
      document.body.appendChild(installBtn);
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      showInstallButton();
    });

    window.addEventListener("appinstalled", function () {
      if (installBtn) installBtn.style.display = "none";
      deferredPrompt = null;
    });
  })();
</script>
</body>
</html>
