<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
  html, body { margin:0; padding:0; }
  * { font-family: 'Sarabun', sans-serif; }
  .sts-display { font-family: 'Kanit', sans-serif; }
  .sts-mono { font-family: 'JetBrains Mono', monospace; }

  /* โหมดกลางวัน/กลางคืน สำหรับฝั่งคนขับ ควบคุมด้วย class .theme-day / .theme-night */
  .theme-day {

  .theme-night .sts-skull-4 path { stroke: #C4C9D1; stroke-width: 3.2; stroke-linejoin: round; }

    --progress-track: #20242A; --hazard-a: #FFC531; --hazard-b: #14161A;
    --modal-bg: rgba(0,0,0,0.7); --modal-card-bg: #1E2227; --modal-card-border: #2A2F35;

  .sts-light { background:var(--bg); color:var(--text-primary); min-height:100vh; transition: background .25s ease, color .25s ease; }

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ============================= ไอคอน (อิโมจิแทน เพื่อไม่ต้องพึ่งไลบรารีภายนอก) ============================= */
function IconBase({ children, size = 16, style, className }) {
  return <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-block", ...style }}>{children}</span>;
}
const Truck = (p) => <IconBase {...p}>🚛</IconBase>;
const ShieldCheck = (p) => <IconBase {...p}>🛡️</IconBase>;
const Star = (p) => <IconBase {...p}>⭐</IconBase>;
const ChevronRight = (p) => <IconBase {...p}>›</IconBase>;
const ChevronLeft = (p) => <IconBase {...p}>‹</IconBase>;
const Check = (p) => <IconBase {...p}>✓</IconBase>;
const Users = (p) => <IconBase {...p}>👥</IconBase>;
const ClipboardList = (p) => <IconBase {...p}>📋</IconBase>;
const Gift = (p) => <IconBase {...p}>🎁</IconBase>;
const LogOut = (p) => <IconBase {...p}>🚪</IconBase>;
const ListChecks = (p) => <IconBase {...p}>📝</IconBase>;
const Home = (p) => <IconBase {...p}>🏠</IconBase>;
const Plus = (p) => <IconBase {...p}>➕</IconBase>;
const Tv = (p) => <IconBase {...p}>📺</IconBase>;
const Lock = (p) => <IconBase {...p}>🔒</IconBase>;
const Upload = (p) => <IconBase {...p}>📤</IconBase>;
const Download = (p) => <IconBase {...p}>📥</IconBase>;
const Pencil = (p) => <IconBase {...p}>✏️</IconBase>;
const Trash2 = (p) => <IconBase {...p}>🗑️</IconBase>;
const XIcon = (p) => <IconBase {...p}>✕</IconBase>;
const LinkIcon = (p) => <IconBase {...p}>🔗</IconBase>;
const Trophy = (p) => <IconBase {...p}>🏆</IconBase>;
const AlertIcon = (p) => <IconBase {...p}>⚠️</IconBase>;

/* ============================= เหตุการณ์ความปลอดภัย (Incident / Accident) =============================
   แยกจากระบบดาวรางวัลโดยสิ้นเชิง: เก็บที่ Firebase node "incidents" เท่านั้น
   ไม่หักดาว ไม่กระทบคะแนนสะสม/แรงค์/โทเคน/การแลกรางวัล

   ⚙️ ค่าที่แก้ไขได้ง่าย (อยู่ตรงนี้ที่เดียว) -------------------------------------------- */

// กฎ "เกิดซ้ำภายใน N วัน เพิ่ม 1 ระดับ (ไม่เกินระดับ 4)" — เปลี่ยน enabled เป็น true เพื่อเปิดใช้ (ค่าเริ่มต้น: ปิด)
const REPEAT_ESCALATION = { enabled: false, withinDays: 90 };

// ระดับกระโหลก 4 ระดับ (ชื่อ + สี)
const INCIDENT_LEVELS = {
  1: { level: 1, name: "เล็กน้อย", color: "#D4B25C" },
  2: { level: 2, name: "ปานกลาง", color: "#CC8A4E" },
  3: { level: 3, name: "รุนแรง", color: "#B25550" },
  4: { level: 4, name: "ร้ายแรง", color: "#2E2E2E" },
};
const INCIDENT_LEVEL_KEYS = [1, 2, 3, 4];

const PROPERTY_LEVELS = [
  { key: "minor", label: "เล็กน้อย" },
  { key: "moderate", label: "ปานกลาง" },
  { key: "high", label: "สูง" },
];
const INJURY_LEVELS = [
  { key: "firstaid", label: "ปฐมพยาบาล" },
  { key: "doctor", label: "พบแพทย์" },
  { key: "severe", label: "สาหัสหรือเสียชีวิต" },
];
const INCIDENT_TYPES = {
  incident: { key: "incident", label: "Incident", desc: "เหตุการณ์ไม่มีบาดเจ็บ เกือบเกิดหรือผิดระเบียบ" },
  accident: { key: "accident", label: "Accident", desc: "เกิดความเสียหายหรือบาดเจ็บจริง" },
};
const INCIDENT_TOPICS = [
  { key: "complaint", label: "คอมเพลนจากลูกค้า" },
  { key: "behavior", label: "พฤติกรรมไม่เหมาะสม", hint: "รวมแต่งกายไม่ปลอดภัย PPE ขับเร็ว ฝ่าฝืนกฎ" },
  { key: "other", label: "อื่นๆ" },
];
const INCIDENT_SOURCES = ["ลูกค้าแจ้ง", "รปภ.", "กล้องวงจรปิด", "เจ้าหน้าที่สังเกตเอง"];
const INCIDENT_PERIODS = [
  { key: "all", label: "ทั้งหมด" },
  { key: "30d", label: "30 วัน" },
  { key: "90d", label: "90 วัน" },
  { key: "year", label: "ปีนี้" },
];

// พิกัดกระโหลก (วาดเอง): ตัวกะโหลก + เบ้าตา 2 ข้าง + จมูก + ซี่ฟัน เป็นช่องเจาะทะลุ (เห็นสีพื้นหลังของหน้าจอเอง)
const SKULL_PATH =
  "M50 6 C26 6 10 23 10 44 C10 57 16 66 25 71 L25 84 Q25 90 31 90 L69 90 Q75 90 75 84 L75 71 C84 66 90 57 90 44 C90 23 74 6 50 6 Z " +
  "M24 47 a10 11 0 1 0 20 0 a10 11 0 1 0 -20 0 Z " +
  "M56 47 a10 11 0 1 0 20 0 a10 11 0 1 0 -20 0 Z " +
  "M50 58 L43 71 Q43 73 45 73 L55 73 Q57 73 57 71 Z " +
  "M38 79 h4 v8 h-4 Z M48 79 h4 v8 h-4 Z M58 79 h4 v8 h-4 Z";

// "กระโหลก": สีตามระดับ เบ้าตา/จมูกเป็นช่องโปร่ง (เห็นสีพื้นหลัง) ระดับ 4 (ดำ) ในโหมดกลางคืนมีขอบสีอ่อน (CSS .sts-skull-4)
function SkullIcon({ level = 1, size = 28 }) {
  const info = INCIDENT_LEVELS[level] || INCIDENT_LEVELS[1];
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 100 100"
      role="img"
      aria-label={`กระโหลก ระดับ ${info.level} ${info.name}`}
      className={`sts-skull sts-skull-${info.level}`}
      style={{ display: "inline-block", flexShrink: 0 }}
    >
      <path d={SKULL_PATH} fill={info.color} fillRule="evenodd" />
    </svg>
  );
}

/* ---------- วันที่/เวลา (ใช้เวลาท้องถิ่นของเครื่อง) ---------- */
const localDateStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const localTimeStr = (d = new Date()) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

function parseLocalDate(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || "");
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
}
function formatIncidentDate(str) {
  const d = parseLocalDate(str);
  return d ? d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }) : str || "";
}
function daysBetweenDates(fromStr, toStr) {
  const a = parseLocalDate(fromStr);
  const b = parseLocalDate(toStr);
  if (!a || !b) return NaN;
  return Math.round((b - a) / 86400000);
}
function daysSinceDate(str) {
  const d = daysBetweenDates(str, localDateStr());
  return isNaN(d) ? 0 : Math.max(0, d);
}
function sortIncidentsNewestFirst(list) {
  return [...list].sort((a, b) => `${b.date || ""} ${b.time || ""} ${b.createdAt || ""}`.localeCompare(`${a.date || ""} ${a.time || ""} ${a.createdAt || ""}`));
}
function countIncidentsByLevel(list) {
  const c = { 1: 0, 2: 0, 3: 0, 4: 0 };
  list.forEach((i) => { if (c[i.level] !== undefined) c[i.level] += 1; });
  return c;
}
function filterIncidentsByPeriod(list, period) {
  if (period === "all") return list;
  const today = localDateStr();
  if (period === "year") return list.filter((i) => (i.date || "").slice(0, 4) === today.slice(0, 4));
  const d = new Date();
  d.setDate(d.getDate() - (period === "30d" ? 30 : 90));
  const from = localDateStr(d);
  return list.filter((i) => (i.date || "") >= from);
}

/* ---------- คำนวณระดับกระโหลกอัตโนมัติ (ฟังก์ชันเดียว แก้เกณฑ์ที่นี่) ----------
   ระดับ 1: Incident ที่ไม่มีความเสียหาย
   ระดับ 2: Accident ที่ทรัพย์สินเสียหายเล็กน้อย/ปานกลาง หรือบาดเจ็บแค่ปฐมพยาบาล
   ระดับ 3: Accident ที่ทรัพย์สินเสียหายสูง หรือบาดเจ็บถึงพบแพทย์
   ระดับ 4: บาดเจ็บสาหัสหรือเสียชีวิต
   ถ้าข้อมูลยังไม่ครบ คืนค่า null
   history = รายการเหตุการณ์อื่นๆ ของคนขับคนเดียวกัน (ใช้กับกฎเกิดซ้ำ REPEAT_ESCALATION เมื่อเปิดใช้) */
function calcLevel(input, history) {
  const { type, damage, propertyLevel, injuryLevel } = input || {};
  let level = 0;
  let reason = "";
  if (type === "incident" && damage === "none") {
    level = 1; reason = "Incident ไม่มีความเสียหาย";
  } else if (type === "accident" && damage === "property") {
    if (propertyLevel === "minor") { level = 2; reason = "Accident ทรัพย์สินเสียหายเล็กน้อย"; }
    else if (propertyLevel === "moderate") { level = 2; reason = "Accident ทรัพย์สินเสียหายปานกลาง"; }
    else if (propertyLevel === "high") { level = 3; reason = "Accident ทรัพย์สินเสียหายสูง"; }
  } else if (type === "accident" && damage === "injury") {
    if (injuryLevel === "firstaid") { level = 2; reason = "Accident บาดเจ็บแค่ปฐมพยาบาล"; }
    else if (injuryLevel === "doctor") { level = 3; reason = "Accident บาดเจ็บถึงพบแพทย์"; }
    else if (injuryLevel === "severe") { level = 4; reason = "บาดเจ็บสาหัสหรือเสียชีวิต"; }
  }
  if (!level) return null;

  if (REPEAT_ESCALATION.enabled && level < 4 && input.driverId && input.date) {
    const repeated = (history || []).some((o) => {
      if (o.id && o.id === input.id) return false;
      if (o.driverId !== input.driverId) return false;
      const gap = daysBetweenDates(o.date, input.date);
      return !isNaN(gap) && gap >= 0 && gap <= REPEAT_ESCALATION.withinDays && (gap > 0 || (o.time || "") <= (input.time || ""));
    });
    if (repeated) {
      level += 1;
      reason += ` + เกิดซ้ำภายใน ${REPEAT_ESCALATION.withinDays} วัน (เพิ่ม 1 ระดับ)`;
    }
  }
  return { level, reason };
}

/* ---------- ข้อความแสดงผลของเหตุการณ์ (รองรับข้อมูลเก่าที่ยังไม่มีฟิลด์ใหม่) ---------- */
function incidentTopicsList(inc) {
  const keys = Array.isArray(inc.topics) ? inc.topics : [];
  const labels = keys.map((k) => (INCIDENT_TOPICS.find((t) => t.key === k) || {}).label).filter(Boolean);
  if (labels.length === 0 && inc.category) labels.push(inc.category); // ข้อมูลรุ่นก่อนหน้าใช้ฟิลด์ category
  return labels;
}
function incidentDamageText(inc) {
  if (inc.damage === "property") {
    const p = PROPERTY_LEVELS.find((x) => x.key === inc.propertyLevel);
    return `ทรัพย์สินเสียหาย${p ? ` · ${p.label}` : ""}`;
  }
  if (inc.damage === "injury") {
    const j = INJURY_LEVELS.find((x) => x.key === inc.injuryLevel);
    return `บาดเจ็บ${j ? ` · ${j.label}` : ""}`;
  }
  return "";
}
function incidentTypeLabel(inc) {
  return INCIDENT_TYPES[inc.type] ? INCIDENT_TYPES[inc.type].label : "";
}

/* ---------- แถบสรุปกระโหลก 4 สี + จำนวน (0 = สีจาง) ---------- */
function IncidentLevelSummary({ incidents, size = 34 }) {
  const counts = countIncidentsByLevel(incidents);
  return (
    <div className="grid grid-cols-4 gap-2">
      {INCIDENT_LEVEL_KEYS.map((lv) => (
        <div key={lv} className="sts-card-l p-2 flex flex-col items-center text-center" style={{ opacity: counts[lv] === 0 ? 0.45 : 1 }}>
          <SkullIcon level={lv} size={size} />
          <div className="text-[11px] text-gray-400 mt-1">{INCIDENT_LEVELS[lv].name}</div>
          <div className="sts-mono sts-display text-lg">{counts[lv]}</div>
        </div>
      ))}
    </div>
  );
}

/* ---------- การ์ดเหตุการณ์แบบย่อ (ใช้ในตารางสรุปเมื่อกดชื่อคนขับ) ---------- */
function IncidentCompactCard({ inc }) {
  const info = INCIDENT_LEVELS[inc.level] || INCIDENT_LEVELS[1];
  const topics = incidentTopicsList(inc);
  const damage = incidentDamageText(inc);
  return (
    <div className="p-2 rounded-lg flex items-start gap-2" style={{ background: "var(--input-bg)" }}>
      <SkullIcon level={inc.level} size={28} />
      <div className="flex-1 min-w-0 text-xs">
        <div className="flex items-center justify-between gap-2">
          <span className="sts-display">ระดับ {info.level} · {info.name}{incidentTypeLabel(inc) ? ` · ${incidentTypeLabel(inc)}` : ""}</span>
          <span className="text-gray-500 sts-mono whitespace-nowrap">{formatIncidentDate(inc.date)}</span>
        </div>
        <div className="text-gray-500">{[...topics, damage].filter(Boolean).join(" · ")}</div>
        {inc.detail && <div className="text-gray-400 mt-0.5" style={{ whiteSpace: "pre-wrap" }}>{inc.detail}</div>}
      </div>
    </div>
  );
}

/* ---------- สรุปกระโหลกรายคน (ใช้ทั้งแท็บ ⚠️ เหตุการณ์ ของแอดมิน และหน้าหัวหน้างาน) ---------- */
function SkullSummaryTable({ drivers, incidents }) {
  const [period, setPeriod] = useState("all");
  const [sortBy, setSortBy] = useState("total"); // total | severe
  const [search, setSearch] = useState("");
  const [showAll, setShowAll] = useState(false);
  const [openId, setOpenId] = useState(null);

  const filtered = filterIncidentsByPeriod(incidents, period);
  const periodLabel = (INCIDENT_PERIODS.find((p) => p.key === period) || {}).label;

  // รวมจำนวนต่อคน (1 เหตุการณ์ = 1 กระโหลกตามระดับที่ระบบคำนวณ)
  const per = {};
  filtered.forEach((i) => {
    if (!per[i.driverId]) per[i.driverId] = { 1: 0, 2: 0, 3: 0, 4: 0, total: 0, items: [] };
    if (per[i.driverId][i.level] !== undefined) per[i.driverId][i.level] += 1;
    per[i.driverId].total += 1;
    per[i.driverId].items.push(i);
  });
  const knownIds = new Set(drivers.map((d) => d.id));
  const baseRows = drivers.map((d) => ({ driver: d, s: per[d.id] || { 1: 0, 2: 0, 3: 0, 4: 0, total: 0, items: [] } }));
  Object.keys(per).forEach((id) => {
    if (!knownIds.has(id)) baseRows.push({ driver: { id, name: `(ไม่พบคนขับ ${id})`, plate: "", unit: "" }, s: per[id] });
  });

  const q = normalizeText(search);
  const rows = baseRows
    .filter((r) => showAll || r.s.total > 0)
    .filter((r) => !q || normalizeText(`${r.driver.name}${r.driver.plate}${r.driver.unit || ""}`).includes(q))
    .sort((a, b) => {
      if (sortBy === "severe") {
        return (b.s[4] - a.s[4]) || (b.s[3] - a.s[3]) || (b.s.total - a.s.total) || String(a.driver.name).localeCompare(String(b.driver.name), "th");
      }
      return (b.s.total - a.s.total) || (b.s[4] - a.s[4]) || (b.s[3] - a.s[3]) || String(a.driver.name).localeCompare(String(b.driver.name), "th");
    });

  const exportExcel = () => {
    const counts = countIncidentsByLevel(filtered);
    const head = ["ชื่อ-สกุล", "ทะเบียนรถ", "สังกัด", "ระดับ 1 เล็กน้อย", "ระดับ 2 ปานกลาง", "ระดับ 3 รุนแรง", "ระดับ 4 ร้ายแรง", "รวมทั้งหมด"];
    const body = rows.map((r) => [r.driver.name, r.driver.plate || "", r.driver.unit || "", r.s[1], r.s[2], r.s[3], r.s[4], r.s.total]);
    const summary = [
      ["สรุปกระโหลกรายคน — SMART TRUCK STAR"],
      [`ช่วงเวลา: ${periodLabel} · สรุป ณ วันที่ ${localDateStr()}`],
      ["รวมทั้งบริษัท", `ระดับ 1: ${counts[1]}`, `ระดับ 2: ${counts[2]}`, `ระดับ 3: ${counts[3]}`, `ระดับ 4: ${counts[4]}`, `รวม: ${filtered.length}`],
      [],
      head,
      ...body,
    ];
    const detailHead = ["วันที่", "เวลา", "ชื่อ-สกุล", "ทะเบียนรถ", "ระดับ", "ประเภท", "เรื่องที่เกิด", "ความเสียหาย", "สถานที่", "รายละเอียด", "แนวทางแก้ไข", "แหล่งที่มา", "เหตุผลที่ได้ระดับ"];
    const detail = sortIncidentsNewestFirst(filtered).map((i) => {
      const d = drivers.find((x) => x.id === i.driverId);
      return [i.date || "", i.time || "", d ? d.name : i.driverId, i.plate || (d ? d.plate : ""), i.level, incidentTypeLabel(i), incidentTopicsList(i).join(", "), incidentDamageText(i), i.place || "", i.detail || "", i.fix || "", i.source || "", i.levelReason || ""];
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), "สรุปรายคน");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([detailHead, ...detail]), "รายการเหตุการณ์");
    XLSX.writeFile(wb, `SmartTruckStar_สรุปกระโหลก_${period}_${localDateStr()}.xlsx`);
  };

  const selectStyle = { background: "var(--input-bg)", color: "var(--text-primary)" };
  const gridCols = { display: "grid", gridTemplateColumns: "minmax(0,1fr) repeat(4, 38px) 34px", alignItems: "center", columnGap: 2 };

  return (
    <div className="space-y-3">
      <div className="flex gap-1.5 overflow-x-auto sts-scroll">
        {INCIDENT_PERIODS.map((p) => (
          <button
            key={p.key}
            onClick={() => setPeriod(p.key)}
            className="sts-btn px-3 py-1.5 rounded-full text-xs whitespace-nowrap"
            style={{ background: period === p.key ? "#FFC531" : "var(--surface)", color: period === p.key ? "#0B0D0F" : "#9CA3AF" }}
          >
            {p.label}
          </button>
        ))}
      </div>

      <div>
        <div className="text-xs text-gray-500 mb-1 px-1">รวมทั้งบริษัท ({periodLabel}) · {filtered.length} เหตุการณ์</div>
        <IncidentLevelSummary incidents={filtered} />
      </div>

      <input
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        placeholder="ค้นหาชื่อ / ทะเบียน / สังกัด..."
        className="sts-card-l w-full px-3 py-2 bg-transparent text-sm"
        style={{ color: "var(--text-primary)" }}
      />
      <div className="flex items-center gap-2">
        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="sts-card-l flex-1 px-3 py-2 text-sm" style={selectStyle}>
          <option value="total">เรียง: จำนวนรวมมากสุดก่อน</option>
          <option value="severe">เรียง: กระโหลกดำ/แดงมากสุดก่อน</option>
        </select>
        <button onClick={exportExcel} className="sts-btn px-3 py-2 rounded-lg text-xs flex items-center gap-1 whitespace-nowrap" style={{ background: "#FFC531", color: "#0B0D0F" }}>
          <Download size={14} /> Excel
        </button>
      </div>
      <label className="flex items-center gap-2 text-xs text-gray-400 px-1">
        <input type="checkbox" checked={showAll} onChange={(e) => setShowAll(e.target.checked)} />
        แสดงคนขับที่ยังไม่มีเหตุการณ์ด้วย
      </label>

      <div className="sts-card-l p-2">
        <div className="px-1 pb-2" style={{ ...gridCols, borderBottom: "1px solid var(--surface-border)" }}>
          <div className="text-[11px] text-gray-500">คนขับ</div>
          {INCIDENT_LEVEL_KEYS.map((lv) => (
            <div key={lv} className="flex justify-center"><SkullIcon level={lv} size={20} /></div>
          ))}
          <div className="text-[11px] text-gray-500 text-center">รวม</div>
        </div>
        {rows.length === 0 && <div className="text-center text-sm text-gray-500 py-6">{incidents.length === 0 ? "ยังไม่มีการบันทึกเหตุการณ์" : "ไม่พบรายการ"}</div>}
        {rows.map((r) => {
          const isOpen = openId === r.driver.id;
          return (
            <div key={r.driver.id} style={{ borderBottom: "1px solid var(--surface-border)" }}>
              <div className="px-1 py-2" style={gridCols}>
                <button onClick={() => setOpenId(isOpen ? null : r.driver.id)} className="text-left min-w-0" disabled={r.s.total === 0} style={{ cursor: r.s.total === 0 ? "default" : "pointer" }}>
                  <div className="text-sm truncate" style={{ color: r.s.total > 0 ? "var(--accent)" : "var(--text-primary)" }}>{r.driver.name}</div>
                  <div className="text-[11px] text-gray-500 sts-mono truncate">{r.driver.plate}{r.driver.unit ? ` · ${r.driver.unit}` : ""}</div>
                </button>
                {INCIDENT_LEVEL_KEYS.map((lv) => (
                  <div key={lv} className="flex flex-col items-center" style={{ opacity: r.s[lv] === 0 ? 0.28 : 1 }}>
                    <SkullIcon level={lv} size={18} />
                    <span className="sts-mono text-xs">{r.s[lv]}</span>
                  </div>
                ))}
                <div className="sts-mono sts-display text-center">{r.s.total}</div>
              </div>
              {isOpen && (
                <div className="space-y-1.5 pb-2 px-1">
                  {sortIncidentsNewestFirst(r.s.items).map((inc) => <IncidentCompactCard key={inc.id} inc={inc} />)}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="text-[11px] text-gray-500 px-1">1 เหตุการณ์ = 1 กระโหลก ตามระดับที่ระบบคำนวณให้ · กดที่ชื่อคนขับเพื่อดูรายการทั้งหมดของคนนั้น</div>
    </div>
  );
}

const EMPTY_INCIDENT_FORM = () => ({ driverId: "", date: localDateStr(), time: localTimeStr(), place: "", type: "", topics: [], damage: "", propertyLevel: "", injuryLevel: "", detail: "", fix: "", source: "" });

/* ---------- ฝั่งเจ้าหน้าที่/แอดมิน: แท็บ ⚠️ เหตุการณ์ ---------- */
function IncidentsAdminTab({ drivers, incidents, onAdd, onUpdate, onDelete, onClear }) {
  const [mode, setMode] = useState("list"); // list | summary
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(EMPTY_INCIDENT_FORM);
  const [formError, setFormError] = useState("");
  const [fSearch, setFSearch] = useState("");
  const [fLevel, setFLevel] = useState("all");
  const [fType, setFType] = useState("all");

  const driverOf = (id) => drivers.find((d) => d.id === id);
  const setField = (k, v) => { setForm((f) => ({ ...f, [k]: v })); setFormError(""); };

  const openNew = () => { setForm(EMPTY_INCIDENT_FORM()); setEditingId(null); setFormError(""); setShowForm(true); setMode("list"); };
  const openEdit = (inc) => {
    setForm({
      driverId: inc.driverId || "",
      date: inc.date || localDateStr(),
      time: inc.time || "",
      place: inc.place || "",
      type: inc.type || "",
      topics: Array.isArray(inc.topics) ? inc.topics : [],
      damage: inc.damage || "",
      propertyLevel: inc.propertyLevel || "",
      injuryLevel: inc.injuryLevel || "",
      detail: inc.detail || "",
      fix: inc.fix || "",
      source: inc.source || "",
    });
    setEditingId(inc.id);
    setFormError("");
    setShowForm(true);
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
  };

  // เลือกประเภท: Incident = ไม่มีความเสียหาย / Accident = ต้องเลือกทรัพย์สินหรือบาดเจ็บ
  const chooseType = (t) => {
    setForm((f) => ({ ...f, type: t, damage: t === "incident" ? "none" : f.damage === "none" ? "" : f.damage, propertyLevel: t === "incident" ? "" : f.propertyLevel, injuryLevel: t === "incident" ? "" : f.injuryLevel }));
    setFormError("");
  };
  const chooseDamage = (dmg) => setForm((f) => ({ ...f, damage: dmg, propertyLevel: dmg === "property" ? f.propertyLevel : "", injuryLevel: dmg === "injury" ? f.injuryLevel : "" }));
  const toggleTopic = (k) => setForm((f) => ({ ...f, topics: f.topics.includes(k) ? f.topics.filter((x) => x !== k) : [...f.topics, k] }));

  const selectedDriver = driverOf(form.driverId);
  const driverHistory = incidents.filter((i) => i.driverId === form.driverId);
  const calc = form.topics.length > 0 ? calcLevel({ ...form, id: editingId }, driverHistory) : null; // ตัวอย่างระดับแบบสด (คำนวณเมื่อเลือกครบทุกขั้น)

  const save = () => {
    if (!form.driverId) return setFormError("กรุณาเลือกคนขับ");
    if (!form.date) return setFormError("กรุณาเลือกวันที่");
    if (!form.type) return setFormError("ขั้น 1: กรุณาเลือกประเภท Incident / Accident");
    if (form.topics.length === 0) return setFormError("ขั้น 2: กรุณาเลือกเรื่องที่เกิดอย่างน้อย 1 ข้อ");
    if (!calc) return setFormError("ขั้น 3: กรุณาเลือกความเสียหายและระดับย่อยให้ครบ");
    if (!form.source) return setFormError("กรุณาเลือกแหล่งที่มา");
    const data = {
      driverId: form.driverId,
      plate: selectedDriver ? selectedDriver.plate || "" : "",
      date: form.date,
      time: form.time || "",
      place: form.place.trim(),
      type: form.type,
      topics: form.topics,
      damage: form.damage,
      propertyLevel: form.damage === "property" ? form.propertyLevel : "",
      injuryLevel: form.damage === "injury" ? form.injuryLevel : "",
      detail: form.detail.trim(),
      fix: form.fix.trim(),
      source: form.source,
      level: calc.level,          // ระดับถูกคำนวณโดยระบบเสมอ (คำนวณใหม่ทุกครั้งที่บันทึก/แก้ไข)
      levelReason: calc.reason,
    };
    if (editingId) onUpdate(editingId, data);
    else onAdd(data);
    setShowForm(false);
    setEditingId(null);
  };

  const remove = (inc) => {
    const d = driverOf(inc.driverId);
    if (window.confirm(`ลบเหตุการณ์นี้ของ ${d ? d.name : inc.driverId} ใช่หรือไม่?`)) onDelete(inc.id);
  };

  const clearAll = () => {
    if (!window.confirm(`ต้องการล้างข้อมูลเหตุการณ์ทั้งหมด ${incidents.length} รายการใช่หรือไม่? (ไม่กระทบดาวและการแลกรางวัล)`)) return;
    const typed = window.prompt('ยืนยันอีกครั้ง: พิมพ์คำว่า "ลบทั้งหมด" เพื่อล้างข้อมูลเหตุการณ์ (ย้อนกลับไม่ได้)');
    if (typed === null || typed.trim() !== "ลบทั้งหมด") {
      window.alert("ยกเลิกการล้างข้อมูล — ยังไม่มีอะไรถูกลบ");
      return;
    }
    onClear();
  };

  const q = normalizeText(fSearch);
  const shown = sortIncidentsNewestFirst(incidents).filter((inc) => {
    if (fLevel !== "all" && String(inc.level) !== fLevel) return false;
    if (fType !== "all" && inc.type !== fType) return false;
    if (q) {
      const d = driverOf(inc.driverId);
      const hay = normalizeText(`${d ? d.name : ""}${d ? d.plate : ""}${inc.plate || ""}${inc.driverId}`);
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const inputCls = "sts-card-l w-full px-3 py-2 bg-transparent text-sm";
  const inputStyle = { color: "var(--text-primary)" };
  const selectStyle = { background: "var(--input-bg)", color: "var(--text-primary)" };
  const label = (t) => <div className="text-xs text-gray-500 mb-1">{t}</div>;
  const chip = (selected, disabled) => ({
    border: selected ? "2px solid #FFC531" : "1px solid var(--surface-border)",
    background: selected ? "rgba(255,197,49,0.10)" : "var(--input-bg)",
    color: "var(--text-primary)",
    opacity: disabled ? 0.4 : 1,
    cursor: disabled ? "not-allowed" : "pointer",
  });

  return (
    <div className="p-4 space-y-3 sts-fadein">
      <div className="text-xs text-gray-400 leading-relaxed">
        บันทึกเหตุการณ์ความปลอดภัยของคนขับ <b>แยกจากระบบดาวทั้งหมด</b> — ไม่หักดาว ไม่กระทบคะแนนสะสม แรงค์ หรือการแลกรางวัล ระดับกระโหลกระบบคำนวณให้อัตโนมัติ
      </div>

      <div className="flex gap-2">
        {[{ k: "list", l: "📋 รายการเหตุการณ์" }, { k: "summary", l: "📊 สรุปรายคน" }].map((t) => (
          <button key={t.k} onClick={() => setMode(t.k)} className="sts-btn flex-1 py-2 rounded-full text-sm" style={{ background: mode === t.k ? "#FFC531" : "var(--surface)", color: mode === t.k ? "#0B0D0F" : "#9CA3AF" }}>{t.l}</button>
        ))}
      </div>

      {mode === "summary" && <SkullSummaryTable drivers={drivers} incidents={incidents} />}

      {mode === "list" && (
        <React.Fragment>
          <IncidentLevelSummary incidents={incidents} />

          {!showForm && (
            <button onClick={openNew} className="sts-btn sts-card-l w-full p-3 flex items-center justify-center gap-2 text-sm" style={{ color: "#FFC531" }}>
              <Plus size={16} /> บันทึกเหตุการณ์ใหม่
            </button>
          )}

          {showForm && (
            <div className="sts-card-l p-4 space-y-3">
              <div className="flex items-center justify-between">
                <div className="text-sm sts-display">{editingId ? "แก้ไขเหตุการณ์" : "บันทึกเหตุการณ์ใหม่"}</div>
                <button onClick={() => { setShowForm(false); setEditingId(null); }} className="text-gray-500"><XIcon size={16} /></button>
              </div>

              <div>
                {label("คนขับ (พิมพ์ชื่อหรือทะเบียน)")}
                <DriverPickerDark drivers={drivers} selectedId={form.driverId} onSelect={(id) => setField("driverId", id)} />
                {selectedDriver && <div className="text-xs text-gray-500 mt-1 sts-mono">🚛 ทะเบียนรถ: {selectedDriver.plate || "-"}{selectedDriver.unit ? ` · ${selectedDriver.unit}` : ""}</div>}
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  {label("วันที่")}
                  <input type="date" value={form.date} onChange={(e) => setField("date", e.target.value)} className={inputCls} style={inputStyle} />
                </div>
                <div>
                  {label("เวลา")}
                  <input type="time" value={form.time} onChange={(e) => setField("time", e.target.value)} className={inputCls} style={inputStyle} />
                </div>
              </div>

              <div>
                {label("สถานที่")}
                <input value={form.place} onChange={(e) => setField("place", e.target.value)} placeholder="เช่น หน้าโรงงานลูกค้า, ลานจอด" className={inputCls} style={inputStyle} />
              </div>

              {/* ขั้น 1 */}
              <div>
                {label("ขั้น 1 · ประเภท")}
                <div className="grid grid-cols-2 gap-2">
                  {Object.values(INCIDENT_TYPES).map((t) => (
                    <button key={t.key} type="button" onClick={() => chooseType(t.key)} className="sts-btn p-2 rounded-lg text-left" style={chip(form.type === t.key)}>
                      <div className="sts-display text-sm">{t.label}</div>
                      <div className="text-[11px] text-gray-500 leading-snug">{t.desc}</div>
                    </button>
                  ))}
                </div>
              </div>

              {form.type && (
                <React.Fragment>
                  {/* ขั้น 2 (โผล่ต่อจากขั้น 1) */}
                  <div className="sts-fadein">
                    {label("ขั้น 2 · เรื่องที่เกิด (เลือกได้หลายข้อ)")}
                    <div className="space-y-1.5">
                      {INCIDENT_TOPICS.map((t) => {
                        const on = form.topics.includes(t.key);
                        return (
                          <button key={t.key} type="button" onClick={() => toggleTopic(t.key)} className="sts-btn w-full px-3 py-2 rounded-lg text-left flex items-start gap-2" style={chip(on)}>
                            <span className="text-sm" style={{ width: 16 }}>{on ? "☑" : "☐"}</span>
                            <span>
                              <span className="text-sm">{t.label}</span>
                              {t.hint && <span className="block text-[11px] text-gray-500">{t.hint}</span>}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                    <div className="text-[11px] text-gray-500 mt-1">ทรัพย์สินเสียหายและบาดเจ็บ ให้เลือกในขั้น 3</div>
                  </div>

                  {/* ขั้น 3 (โผล่เมื่อเลือกเรื่องที่เกิดแล้ว) */}
                  {form.topics.length > 0 && (
                  <div className="sts-fadein">
                    {label("ขั้น 3 · ความเสียหาย")}
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { k: "none", l: "ไม่มี", disabled: form.type === "accident" },
                        { k: "property", l: "ทรัพย์สินเสียหาย", disabled: form.type === "incident" },
                        { k: "injury", l: "บาดเจ็บ", disabled: form.type === "incident" },
                      ].map((o) => (
                        <button key={o.k} type="button" disabled={o.disabled} onClick={() => chooseDamage(o.k)} className="sts-btn px-2 py-2 rounded-lg text-xs" style={chip(form.damage === o.k, o.disabled)}>{o.l}</button>
                      ))}
                    </div>
                    <div className="text-[11px] text-gray-500 mt-1">
                      {form.type === "incident" ? "Incident คือเหตุการณ์ที่ไม่มีความเสียหาย" : "Accident ต้องมีความเสียหายหรือบาดเจ็บจริง · ถ้ามีทั้งสองอย่างให้เลือก \"บาดเจ็บ\""}
                    </div>

                    {form.damage === "property" && (
                      <div className="grid grid-cols-3 gap-2 mt-2">
                        {PROPERTY_LEVELS.map((p) => (
                          <button key={p.key} type="button" onClick={() => setField("propertyLevel", p.key)} className="sts-btn px-2 py-2 rounded-lg" style={chip(form.propertyLevel === p.key)}>
                            <div className="text-sm">{p.label}</div>
                          </button>
                        ))}
                      </div>
                    )}
                    {form.damage === "injury" && (
                      <div className="grid grid-cols-3 gap-2 mt-2">
                        {INJURY_LEVELS.map((j) => (
                          <button key={j.key} type="button" onClick={() => setField("injuryLevel", j.key)} className="sts-btn px-2 py-2 rounded-lg text-sm leading-tight" style={chip(form.injuryLevel === j.key)}>{j.label}</button>
                        ))}
                      </div>
                    )}
                  </div>
                  )}

                  {/* ตัวอย่างกระโหลกที่ระบบกำหนด (โผล่เมื่อเลือกครบ) */}
                  {calc && (
                  <div className="p-3 rounded-lg flex items-center gap-3 sts-fadein" style={{ background: "var(--input-bg)", border: "1px dashed var(--surface-border)" }}>

/* ดาวของแต่ละขั้น (cost = ดาวสูงสุดของขั้น และเป็นจำนวนโทเคนที่ใช้แลกรางวัลของขั้นนั้น)
   ค่าเริ่มต้นตามนี้ แต่แอดมินแก้ได้จากหลังบ้าน แท็บ ⚙️ ตั้งค่า (เก็บที่ Firebase: settings/levelCosts) */
const DEFAULT_LEVEL_COSTS = [19, 49, 99, 149, 199];

let MAX_RANK_STARS = DEFAULT_LEVEL_COSTS[DEFAULT_LEVEL_COSTS.length - 1];

const LEVELS = [
  { id: "lvl0", min: 0,   max: 19,  cost: 19,  name: "นักขับมือใหม่" },
  { id: "lvl1", min: 20,  max: 49,  cost: 49,  name: "นักขับใส่ใจปลอดภัย" },
  { id: "lvl2", min: 50,  max: 99,  cost: 99,  name: "นักขับมืออาชีพ" },
  { id: "lvl3", min: 100, max: 149, cost: 149, name: "แชมป์ความปลอดภัย" },
  { id: "lvl4", min: 150, max: Infinity, cost: 199, name: "สุดยอดนักขับ SMART TRUCK" },
];

function isValidLevelCosts(c) {
  if (!Array.isArray(c) || c.length !== LEVELS.length) return false;
  for (let i = 0; i < c.length; i++) {
    if (!Number.isInteger(c[i]) || c[i] < 1) return false;
    if (i > 0 && c[i] <= c[i - 1]) return false;
  }
  return true;
}

// ใช้ค่าดาวของแต่ละขั้นกับตัวแปร LEVELS (แก้ค่าในที่เดิม เพื่อให้ทุกจุดในแอปใช้ค่าล่าสุดพร้อมกัน)
function applyLevelCosts(raw) {
  let c = raw && typeof raw === "object" ? (Array.isArray(raw) ? raw : Object.values(raw)) : null;
  c = c ? c.map(Number) : null;
  if (!isValidLevelCosts(c)) c = DEFAULT_LEVEL_COSTS;
  LEVELS.forEach((l, i) => {
    l.cost = c[i];
    l.min = i === 0 ? 0 : c[i - 1] + 1;
    l.max = i === LEVELS.length - 1 ? Infinity : c[i];
  });
  MAX_RANK_STARS = c[c.length - 1];
  return c;
}

function matchHeader(headers, aliases) {
  return headers.find((h) => aliases.some((a) => String(h).trim().toLowerCase().includes(a)));
}

function parseDriversFromWorkbook(workbook, existingIds) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
  if (rows.length === 0) return [];
  const headers = Object.keys(rows[0]);
  const nameKey = matchHeader(headers, ["ชื่อ", "name"]);
  const plateKey = matchHeader(headers, ["ทะเบียน", "plate"]);
  const unitKey = matchHeader(headers, ["สังกัด", "หน่วยงาน", "unit", "team"]);
  const idKey = matchHeader(headers, ["รหัส", "code", "id"]);

  let maxNum = existingIds.reduce((max, id) => {
    const m = /ST-(\d+)/.exec(id);
    return m ? Math.max(max, parseInt(m[1], 10)) : max;
  }, 0);

  return rows
    .filter((r) => nameKey && String(r[nameKey]).trim() !== "")
    .map((r) => {
      let id = idKey && String(r[idKey]).trim() ? String(r[idKey]).trim() : null;
      if (!id) { maxNum += 1; id = `ST-${String(maxNum).padStart(3, "0")}`; }
      return {
        id,
        name: nameKey ? String(r[nameKey]).trim() : "",
        plate: plateKey ? String(r[plateKey]).trim() : "",
        unit: unitKey ? String(r[unitKey]).trim() : "",
        avatar: DRIVER_AVATAR,
        total: 0,
      };
    });
}

/* อ่านไฟล์รายชื่อผู้เข้าร่วมกิจกรรม (เช่น ใบเซ็นชื่อ) แล้วจับคู่กับคนขับที่มีอยู่แล้วด้วยชื่อหรือทะเบียน */
function parseAttendanceFromWorkbook(workbook, drivers) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
  if (rows.length === 0) return { matchedIds: [], unmatchedNames: [] };
  const headers = Object.keys(rows[0]);
  const nameKey = matchHeader(headers, ["ชื่อ", "name"]);
  const plateKey = matchHeader(headers, ["ทะเบียน", "plate"]);

  const matchedIds = [];
  const unmatchedNames = [];
  rows.forEach((r) => {
    const nameVal = nameKey ? String(r[nameKey]).trim() : "";
    const plateVal = plateKey ? String(r[plateKey]).trim() : "";
    if (!nameVal && !plateVal) return;
    const nameQ = normalizeText(nameVal);
    const plateQ = normalizeText(plateVal);
    const found = drivers.find((d) => (plateQ && normalizeText(d.plate) === plateQ) || (nameQ && normalizeText(d.name) === nameQ));
    if (found) {
      if (!matchedIds.includes(found.id)) matchedIds.push(found.id);
    } else {
      unmatchedNames.push(nameVal || plateVal);
    }
  });
  return { matchedIds, unmatchedNames };
}

const todayStr = () => new Date().toISOString().slice(0, 10);
function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function seedLogs() {
  const weights = { ppe: 0.34, safety: 0.30, activity: 0.16, quiz: 0.12, special: 0.08 };
  let logs = [];
  let idCounter = 1;
  DRIVER_SEED.forEach((d) => {
    let remaining = Object.fromEntries(STAR_ORDER.map((k) => [k, Math.round(d.total * weights[k])]));
    const sum = STAR_ORDER.reduce((a, k) => a + remaining[k], 0);
    remaining.ppe += d.total - sum;
    STAR_ORDER.forEach((type) => {
      let left = remaining[type];
      let chunkCount = Math.max(1, Math.round(left / 3));
      for (let i = 0; i < chunkCount && left > 0; i++) {
        const amt = i === chunkCount - 1 ? left : Math.max(1, Math.round(left / (chunkCount - i)));
        left -= amt;
        const reasons = REASONS[type];
        logs.push({
          id: idCounter++,
          driverId: d.id,
          type,
          amount: amt,
          reason: reasons[Math.floor(Math.random() * reasons.length)],
          date: daysAgo(Math.floor(Math.random() * 6) + 1),
          givenBy: "หัวหน้างาน",
        });
      }
    });
  });
  return logs;
}

function getLevel(total) {
  return LEVELS.find((l) => total >= l.min && total <= l.max) || LEVELS[LEVELS.length - 1];
}
function getNextLevel(total) {
  const idx = LEVELS.findIndex((l) => total >= l.min && total <= l.max);
  return LEVELS[idx + 1] || null;
}

function AdminView({ drivers, setDrivers, logs, addStar, exit, onBack, onResetStars, rewardConfig, setRewardConfig, redemptions, onCancelRedemption, onMarkRedemptionPicked, staffPin, onChangeStaffPin, levelCosts, onSaveLevelCosts, onResetRedemptions, onUpdateLog, onDeleteLog, quests, onAddQuest, onUpdateQuest, onDeleteQuest, onBackfillQuestLinks, archives, onArchiveAndResetYear, incidents, onAddIncident, onUpdateIncident, onDeleteIncident, onClearIncidents, theme, onToggleTheme }) {
  const [openArchiveId, setOpenArchiveId] = useState(null);
  const [tab, setTab] = useState("share");
  const [redFilter, setRedFilter] = useState("pending"); // pending | picked | all
  const [redMonth, setRedMonth] = useState("all"); // "all" หรือ "YYYY-MM"
  const [pinForm, setPinForm] = useState({ current: "", next: "", confirm: "" });
  const [pinMsg, setPinMsg] = useState(null); // { ok, text }
  const [levelForm, setLevelForm] = useState(() => LEVELS.map((l) => String(l.cost)));
  const [levelMsg, setLevelMsg] = useState(null); // { ok, text }
  useEffect(() => { setLevelForm(LEVELS.map((l) => String(l.cost))); }, [levelCosts]);
  const [giveSearch, setGiveSearch] = useState("");
  const [selectedIds, setSelectedIds] = useState([]);
  const [flash, setFlash] = useState(null);
  const givingRef = useRef(false); // กันกดซ้ำ/แตะรัว ไม่ให้ยิงคำสั่งให้ดาวซ้ำก่อนจอทันอัปเดต

  const fileInputRef = useRef(null);
  const questImportRef = useRef(null);
  const [replaceAll, setReplaceAll] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [form, setForm] = useState({ id: "", name: "", plate: "", unit: "" });
  const [editingId, setEditingId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingLog, setEditingLog] = useState(null);
  const [logSearch, setLogSearch] = useState("");
  const [driverSearch, setDriverSearch] = useState("");
  const [questImportMsg, setQuestImportMsg] = useState("");

  const openNewForm = () => { setForm({ id: "", name: "", plate: "", unit: "" }); setEditingId(null); setShowForm(true); };
  const openEditForm = (d) => { setForm({ id: d.id, name: d.name, plate: d.plate || "", unit: d.unit || "" }); setEditingId(d.id); setShowForm(true); };

  const saveForm = () => {
    if (!form.name.trim()) return;
    if (editingId) {
      setDrivers((prev) => prev.map((d) => (d.id === editingId ? { ...d, name: form.name, plate: form.plate, unit: form.unit } : d)));
    } else {
      let maxNum = drivers.reduce((max, d) => {
        const m = /ST-(\d+)/.exec(d.id);
        return m ? Math.max(max, parseInt(m[1], 10)) : max;
      }, 0);
      const newId = form.id.trim() || `ST-${String(maxNum + 1).padStart(3, "0")}`;
      setDrivers((prev) => [...prev, { id: newId, name: form.name, plate: form.plate, unit: form.unit, avatar: DRIVER_AVATAR, total: 0 }]);
    }
    setShowForm(false);
  };

  const removeDriver = (id) => {
    if (window.confirm("ต้องการลบคนขับคนนี้ออกจากระบบใช่หรือไม่?")) {
      setDrivers((prev) => prev.filter((d) => d.id !== id));
    }
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const imported = parseDriversFromWorkbook(wb, drivers.map((d) => d.id));
        if (imported.length === 0) {
          setImportMsg("ไม่พบข้อมูลที่อ่านได้ กรุณาตรวจสอบหัวคอลัมน์ (ชื่อ / ทะเบียน / สังกัด)");
        } else if (replaceAll) {
          setDrivers(imported);
          setImportMsg(`นำเข้าสำเร็จ ${imported.length} คน (แทนที่รายชื่อเดิมทั้งหมด)`);
        } else {
          setDrivers((prev) => [...prev, ...imported]);
          setImportMsg(`นำเข้าสำเร็จ ${imported.length} คน (เพิ่มต่อจากรายชื่อเดิม)`);
        }
      } catch (err) {
        setImportMsg("อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ .xlsx หรือ .csv ที่ถูกต้อง");
      }
      if (fileInputRef.current) fileInputRef.current.value = "";
      setTimeout(() => setImportMsg(""), 4000);
    };
    reader.readAsArrayBuffer(file);
  };

  const handleQuestImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const { matchedIds, unmatchedNames } = parseAttendanceFromWorkbook(wb, drivers);
        setSelectedIds(matchedIds);
        if (matchedIds.length === 0) {
          setQuestImportMsg("ไม่พบชื่อที่ตรงกับรายชื่อคนขับในระบบเลย กรุณาตรวจสอบหัวคอลัมน์ (ชื่อ / ทะเบียน)");
        } else if (unmatchedNames.length > 0) {
          setQuestImportMsg(`เลือกให้อัตโนมัติ ${matchedIds.length} คน · หาไม่พบ ${unmatchedNames.length} รายชื่อ: ${unmatchedNames.slice(0, 5).join(", ")}${unmatchedNames.length > 5 ? " ..." : ""}`);
        } else {
          setQuestImportMsg(`เลือกให้อัตโนมัติครบทั้งหมด ${matchedIds.length} คน`);
        }
      } catch (err) {
        setQuestImportMsg("อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ .xlsx หรือ .csv ที่ถูกต้อง");
      }
      if (questImportRef.current) questImportRef.current.value = "";
      setTimeout(() => setQuestImportMsg(""), 6000);
    };
    reader.readAsArrayBuffer(file);
  };

  const giveQuery = normalizeText(giveSearch);
  const filteredForGiving = giveQuery
    ? drivers.filter((d) => normalizeText(d.name).includes(giveQuery) || normalizeText(d.plate).includes(giveQuery))
    : drivers;

  const toggleSelect = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };
  const clearSelection = () => setSelectedIds([]);

  const [showQuestForm, setShowQuestForm] = useState(false);
  const [questDraft, setQuestDraft] = useState({ name: "", type: STAR_ORDER[0], amount: "1" });
  const [editingQuestId, setEditingQuestId] = useState(null);
  const [activeQuestId, setActiveQuestId] = useState(null);

  // คนที่ได้ดาวจากเควสที่กำลังเปิดอยู่ไปแล้ว "วันนี้" กันเลือกซ้ำโดยไม่ตั้งใจ (เช่น ตอบคำถามในที่ประชุมแล้วโดนติ๊กซ้ำ)
  const alreadyGivenTodayIds = new Set(
    logs.filter((l) => l.questId === activeQuestId && l.date === todayStr()).map((l) => l.driverId)
  );
  const selectAllFiltered = () => setSelectedIds(filteredForGiving.filter((d) => !alreadyGivenTodayIds.has(d.id)).map((d) => d.id));

  const openNewQuestForm = () => { setQuestDraft({ name: "", type: STAR_ORDER[0], amount: "1" }); setEditingQuestId(null); setShowQuestForm(true); };
  const openEditQuestForm = (q) => { setQuestDraft({ name: q.name, type: q.type, amount: String(q.amount) }); setEditingQuestId(q.id); setShowQuestForm(true); };

  const saveQuest = () => {
    if (!questDraft.name.trim() || !Number(questDraft.amount) || Number(questDraft.amount) <= 0) return;
    if (editingQuestId) {
      onUpdateQuest(editingQuestId, { name: questDraft.name.trim(), type: questDraft.type, amount: Number(questDraft.amount) });
    } else {
      onAddQuest(questDraft.name.trim(), questDraft.type, questDraft.amount);
    }
    setShowQuestForm(false);
  };

  const removeQuest = (id) => {
    if (window.confirm("ต้องการลบเควสนี้ใช่หรือไม่? (ดาวที่เคยมอบไปแล้วจากเควสนี้จะไม่ถูกลบ)")) {
      onDeleteQuest(id);
    }
  };

  const openQuestGiver = (questId) => { setActiveQuestId(questId); clearSelection(); setGiveSearch(""); };
  const closeQuestGiver = () => { setActiveQuestId(null); clearSelection(); };

  const giveQuest = () => {
    const quest = quests.find((q) => q.id === activeQuestId);
    if (!quest || selectedIds.length === 0 || givingRef.current) return;
    const dupCount = selectedIds.filter((id) => alreadyGivenTodayIds.has(id)).length;
    if (dupCount > 0) {
      const ok = window.confirm(`มี ${dupCount} คนที่ได้ดาวจากเควส "${quest.name}" ไปแล้ววันนี้ ต้องการให้ซ้ำอีกรอบใช่หรือไม่?`);
      if (!ok) return;
    }
    givingRef.current = true;
    selectedIds.forEach((id) => addStar(id, quest.type, quest.amount, quest.name, quest.id));
    setFlash(quest.id);
    setTimeout(() => {
      setFlash(null);
      givingRef.current = false;
      setActiveQuestId(null);
      clearSelection();
    }, 1200);
  };

  const endQuestActivity = (questId) => {
    if (window.confirm("ยืนยันเสร็จสิ้นกิจกรรมนี้? กิจกรรมจะย้ายไปเก็บในประวัติ และจะมอบดาวเพิ่มจากกิจกรรมนี้ไม่ได้อีก")) {
      onUpdateQuest(questId, { closedAt: new Date().toISOString() });
      if (activeQuestId === questId) closeQuestGiver();
    }
  };
  const reopenQuestActivity = (questId) => {
    onUpdateQuest(questId, { closedAt: null });
  };

  // สถิติของแต่ละเควส: มีกี่คนได้ดาวไปแล้ว (นับไม่ซ้ำคน) และรวมดาวที่มอบไปทั้งหมด
  const questStatsById = {};
  quests.forEach((q) => {
    const questLogs = logs.filter((l) => l.questId === q.id);
    questStatsById[q.id] = {
      recipients: new Set(questLogs.map((l) => l.driverId)).size,
      totalStars: questLogs.reduce((s, l) => s + l.amount, 0),
      timesGiven: questLogs.length,
    };
  });
  const activeQuests = quests.filter((q) => !q.closedAt);
  const closedQuests = [...quests.filter((q) => q.closedAt)].sort((a, b) => (a.closedAt < b.closedAt ? 1 : -1));

  const [rewardDraft, setRewardDraft] = useState(null); // { levelId, values: [a,b,c] }
  const openRewardEdit = (levelId) => {
    const current = (rewardConfig && rewardConfig[levelId]) || DEFAULT_REWARD_CONFIG[levelId] || ["", "", ""];
    setRewardDraft({ levelId, values: [...current] });
  };
  const saveRewardEdit = () => {
    if (!rewardDraft) return;
    setRewardConfig((prev) => ({ ...(prev || {}), [rewardDraft.levelId]: rewardDraft.values }));
    setRewardDraft(null);
  };

  const sortedLogs = [...logs].sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return String(b.id).localeCompare(String(a.id));
  });
  const logQuery = normalizeText(logSearch);
  const filteredLogs = logQuery
    ? sortedLogs.filter((l) => {
        const d = drivers.find((x) => x.id === l.driverId);
        return normalizeText(d?.name || "").includes(logQuery) || normalizeText(l.reason || "").includes(logQuery);
      })
    : sortedLogs;

  // ยอดดาวสะสม (ถาวร) และโทเคนคงเหลือ (ใช้แลกได้) ของคนขับแต่ละคน สำหรับให้แอดมินดูสถานะ
  const totalFor = (driverId) => logs.filter((l) => l.driverId === driverId).reduce((s, l) => s + l.amount, 0);
  const tokensFor = (driverId) => {
    const total = totalFor(driverId);
    const spent = Object.values((redemptions && redemptions[driverId]) || {}).reduce((s, r) => s + (Number(r.tokensSpent) || 0), 0);
    return Math.max(0, total - spent);
  };
  const breakdownFor = (driverId) => {
    const t = {};
    STAR_ORDER.forEach((k) => (t[k] = 0));
    logs.filter((l) => l.driverId === driverId).forEach((l) => { t[l.type] = (t[l.type] || 0) + l.amount; });
    return t;
  };

  const driverQuery = normalizeText(driverSearch);
  const filteredDrivers = driverQuery
    ? drivers.filter((d) => normalizeText(d.name).includes(driverQuery) || normalizeText(d.plate).includes(driverQuery) || normalizeText(d.unit || "").includes(driverQuery))
    : drivers;

  const rankedDrivers = () =>
    [...drivers]
      .map((d) => ({ ...d, total: totalFor(d.id), ...breakdownFor(d.id) }))
      .sort((a, b) => b.total - a.total);

  const exportDriversExcel = () => {
    const ranked = rankedDrivers();
    const header = ["อันดับ", "ชื่อ-สกุล", "ทะเบียนรถ", "สังกัด", "ดาว PPE", "ดาว Patrol", "ดาวกิจกรรม", "ดาวตอบคำถาม", "ดาวพิเศษ", "ดาวสะสมรวม", "โทเคนคงเหลือ"];
    const rows = ranked.map((d, i) => [i + 1, d.name, d.plate, d.unit, d.ppe, d.safety, d.activity, d.quiz, d.special, d.total, tokensFor(d.id)]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ดาวสะสมคนขับ");
    XLSX.writeFile(wb, `SmartTruckStar_ดาวสะสม_${todayStr()}.xlsx`);
  };

  const exportSafetyHero = () => {
    const top10 = rankedDrivers().slice(0, 10);
    const header = ["อันดับ", "ชื่อ-สกุล", "ทะเบียนรถ", "สังกัด", "ดาวสะสมรวม"];
    const rows = top10.map((d, i) => [i + 1, d.name, d.plate, d.unit, d.total]);
    const ws = XLSX.utils.aoa_to_sheet([["🏆 Safety Hero Top 10 — SMART TRUCK STAR"], [`สรุป ณ วันที่ ${todayStr()}`], [], header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Safety Hero Top 10");
    XLSX.writeFile(wb, `SmartTruckStar_SafetyHero_${todayStr()}.xlsx`);
  };

  // ---------- รายการแลกรางวัล: สถานะรับของ + สรุปรายเดือน ----------
  const monthKeyOf = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  };
  const monthLabelOf = (key) =>
    key === "all" ? "ทั้งหมด" : new Date(Number(key.slice(0, 4)), Number(key.slice(5, 7)) - 1, 1).toLocaleDateString("th-TH", { month: "long", year: "numeric" });
  const redStatusOf = (r) => (r.status === "picked" ? "picked" : "pending");
  const fmtDateTime = (iso) => (iso ? new Date(iso).toLocaleString("th-TH") : "");

  const allRedemptionRows = [];
  Object.keys(redemptions || {}).forEach((driverId) => {
    Object.keys(redemptions[driverId] || {}).forEach((redemptionKey) => {
      const r = redemptions[driverId][redemptionKey];
      allRedemptionRows.push({
        driverId,
        redemptionKey,
        driver: drivers.find((d) => d.id === driverId),
        level: LEVELS.find((l) => l.id === r.levelId),
        ...r,
      });
    });
  });
  allRedemptionRows.sort((a, b) => (b.redeemedAt || "").localeCompare(a.redeemedAt || ""));
  const redPendingAll = allRedemptionRows.filter((r) => redStatusOf(r) === "pending").length;
  const redMonthOptions = Array.from(new Set(allRedemptionRows.map((r) => monthKeyOf(r.redeemedAt)).filter(Boolean))).sort().reverse();
  const redInMonth = allRedemptionRows.filter((r) => redMonth === "all" || monthKeyOf(r.redeemedAt) === redMonth);
  const redShown = redInMonth.filter((r) => redFilter === "all" || redStatusOf(r) === redFilter);
  const redPendingCount = redInMonth.filter((r) => redStatusOf(r) === "pending").length;
  const redPickedCount = redInMonth.length - redPendingCount;
  const redSummary = (() => {
    const map = {};
    redInMonth.forEach((r) => {
      const key = `${r.level?.name || r.levelId}||${r.choice}`;
      if (!map[key]) map[key] = { level: r.level?.name || r.levelId || "", choice: r.choice || "", count: 0, picked: 0, pending: 0 };
      map[key].count += 1;
      if (redStatusOf(r) === "picked") map[key].picked += 1;
      else map[key].pending += 1;
    });
    return Object.values(map).sort((a, b) => b.count - a.count);
  })();

  const exportRedemptionsExcel = () => {
    const header = ["วันที่แลก", "รหัสคนขับ", "ชื่อ-สกุล", "ทะเบียนรถ", "สังกัด", "ขั้น", "รางวัลที่เลือก", "โทเคนที่ใช้", "สถานะ", "วันที่รับของ"];
    const rows = redInMonth.map((r) => [
      fmtDateTime(r.redeemedAt),
      r.driverId,
      r.driver?.name || "",
      r.driver?.plate || "",
      r.driver?.unit || "",
      r.level?.name || r.levelId || "",
      r.choice || "",
      Number(r.tokensSpent) || 0,
      redStatusOf(r) === "picked" ? "รับแล้ว" : "รอรับ",
      fmtDateTime(r.pickedAt),
    ]);
    const summaryRows = [
      [`สรุปการแลกรางวัล — ${monthLabelOf(redMonth)}`],
      ["แลกทั้งหมด (รายการ)", redInMonth.length],
      ["รับของแล้ว", redPickedCount],
      ["รอรับ", redPendingCount],
      [],
      ["ขั้น", "รางวัล", "จำนวน", "รับแล้ว", "รอรับ"],
      ...redSummary.map((x) => [x.level, x.choice, x.count, x.picked, x.pending]),
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "สรุป");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...rows]), "รายการแลกรางวัล");
    XLSX.writeFile(wb, `SmartTruckStar_แลกรางวัล_${redMonth === "all" ? "ทั้งหมด" : redMonth}.xlsx`);
  };

  const levelFormNums = levelForm.map((v) => (v === "" ? NaN : Number(v)));
  const submitLevelCosts = () => {
    if (!isValidLevelCosts(levelFormNums)) {
      return setLevelMsg({ ok: false, text: "กรุณากรอกจำนวนดาวเป็นจำนวนเต็ม และให้ขั้นถัดไปมากกว่าขั้นก่อนหน้าเสมอ" });
    }
    if (!window.confirm(`ยืนยันเปลี่ยนดาวของแต่ละขั้นเป็น ${levelFormNums.join(" / ")} ดาว?\nดาวสะสมของคนขับไม่เปลี่ยน แต่แรงค์และโทเคนที่ต้องใช้แลกรางวัลจะคำนวณใหม่ทันทีทุกเครื่อง`)) return;
    onSaveLevelCosts(levelFormNums)
      .then(() => setLevelMsg({ ok: true, text: "บันทึกเรียบร้อยแล้ว มีผลทันทีทุกเครื่อง" }))
      .catch(() => setLevelMsg({ ok: false, text: "บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือสิทธิ์ Firebase แล้วลองใหม่" }));
  };

  const submitPinChange = () => {
    const cur = pinForm.current.trim();
    const nxt = pinForm.next.trim();
    const cfm = pinForm.confirm.trim();
    if (cur !== (staffPin || STAFF_PIN)) return setPinMsg({ ok: false, text: "รหัสปัจจุบันไม่ถูกต้อง" });
    if (!/^\d{4,8}$/.test(nxt)) return setPinMsg({ ok: false, text: "รหัสใหม่ต้องเป็นตัวเลข 4-8 หลัก" });
    if (nxt !== cfm) return setPinMsg({ ok: false, text: "รหัสใหม่ 2 ช่องไม่ตรงกัน" });
    if (nxt === cur) return setPinMsg({ ok: false, text: "รหัสใหม่ต้องไม่ซ้ำกับรหัสเดิม" });
    onChangeStaffPin(nxt)
      .then(() => {
        setPinForm({ current: "", next: "", confirm: "" });
        setPinMsg({ ok: true, text: "เปลี่ยนรหัสเจ้าหน้าที่เรียบร้อยแล้ว ใช้ได้ทันทีทุกเครื่อง" });
      })
      .catch(() => setPinMsg({ ok: false, text: "บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือสิทธิ์ Firebase แล้วลองใหม่" }));
  };

  const themeClass = theme === "night" ? "theme-night" : "theme-day";

  return (
    <div className={`min-h-screen sts-light ${themeClass} pb-10`}>
      <TopBarDark title="แผงควบคุมผู้ดูแลระบบ" theme={theme} onToggleTheme={onToggleTheme} right={<React.Fragment><button onClick={onBack} className="text-gray-400 text-sm flex items-center gap-1"><ChevronLeft size={16} />กลับ</button><button onClick={exit} className="text-gray-400 text-sm flex items-center gap-1"><LogOut size={16} />ออก</button></React.Fragment>} />
      <div className="flex gap-2 px-4 pt-3 overflow-x-auto sts-scroll">
        {[{ k: "share", l: "🔗 แชร์ลิงก์" }, { k: "demo", l: "🎯 เควสกิจกรรม" }, { k: "rewards", l: "🎁 จัดการรางวัล" }, { k: "redemptions", l: `📦 รายการแลกรางวัล${redPendingAll > 0 ? ` (รอรับ ${redPendingAll})` : ""}` }, { k: "incidents", l: "⚠️ เหตุการณ์" }, { k: "logs", l: "📋 บันทึกดาว" }, { k: "drivers", l: "👷 รายชื่อคนขับ" }, { k: "archives", l: "📚 ประวัติปีก่อน" }, { k: "settings", l: "⚙️ ตั้งค่า" }].map((t) => (
          <button key={t.k} onClick={() => setTab(t.k)} className="sts-btn px-4 py-2 rounded-full text-sm whitespace-nowrap" style={{ background: tab === t.k ? "#FFC531" : "var(--surface)", color: tab === t.k ? "#0B0D0F" : "#9CA3AF" }}>{t.l}</button>
        ))}
      </div>

      {tab === "share" && (
        <div className="p-4 space-y-4 sts-fadein">
          <ShareLinkBox />
          <div className="sts-card-l p-4 text-xs text-gray-400 leading-relaxed">
            💡 ทุกคนที่เปิดลิงก์นี้ (คนขับ / หัวหน้างาน / จอ Leaderboard) จะเห็นข้อมูลชุดเดียวกัน แบบไม่ต้องสมัครสมาชิกหรือล็อกอินใดๆ ระบบจะอัปเดตให้อัตโนมัติทุกๆ 2-4 วินาที
          </div>
          <div className="sts-card-l p-4" style={{ borderColor: "#5A2323" }}>
            <div className="text-sm sts-display mb-2" style={{ color: "#FF6B6B" }}>⚠️ รีเซ็ตข้อมูลดาวทั้งหมด</div>
            <div className="text-xs text-gray-400 mb-3">ล้างประวัติดาวทั้งหมดของทุกคนกลับเป็น 0 ใช้เมื่อยังไม่เริ่มกิจกรรมจริง (ข้อมูลคนขับ/รายชื่อจะไม่หายไป ลบเฉพาะดาวที่เคยให้)</div>
            <button
              onClick={() => {
                if (window.confirm("ยืนยันรีเซ็ตดาวของทุกคนกลับเป็น 0? การกระทำนี้ย้อนกลับไม่ได้")) {
                  if (window.confirm("ยืนยันอีกครั้ง — ต้องการรีเซ็ตข้อมูลดาวทั้งหมดจริงหรือไม่?")) {
                    onResetStars();
                  }
                }
              }}
              className="sts-btn w-full py-2 rounded-lg text-sm sts-display"
              style={{ background: "#5A2323", color: "#FFD9D9" }}
            >
              รีเซ็ตดาวทั้งหมดเป็น 0
            </button>
          </div>

          <div className="sts-card-l p-4" style={{ borderColor: "#8A5A00" }}>
            <div className="text-sm sts-display mb-2" style={{ color: "#FFC531" }}>📚 ปิดรอบปี & เริ่มปีใหม่</div>
            <div className="text-xs text-gray-400 mb-3 leading-relaxed">
              ใช้ตอนสิ้นปี (เช่น สรุปหา Safety Hero ประจำปีแล้ว) ระบบจะ<b>บันทึกอันดับดาวสะสม/โทเคนของทุกคนไว้เป็นประวัติ</b> ก่อน แล้วค่อยรีเซ็ตดาวและโทเคนของทุกคนกลับเป็น 0 เพื่อเริ่มนับปีถัดไป — ข้อมูลปีเก่าดูย้อนหลังได้ที่แท็บ "📚 ประวัติปีก่อน" เสมอ ไม่มีการลบทิ้ง
            </div>
            <button
              onClick={() => {
                const defaultLabel = String(new Date().getFullYear());
                if (redPendingAll > 0 && !window.confirm(`ยังมีของรางวัลที่ยังไม่ได้ส่งมอบ (รอรับ) อีก ${redPendingAll} รายการ\nถ้าปิดรอบปีตอนนี้ รายการเหล่านี้จะถูกย้ายไปเก็บในประวัติปีก่อน และจะไม่แสดงในหน้ารายการรอรับอีก\n\nต้องการดำเนินการต่อหรือไม่?`)) return;
                const label = window.prompt("ตั้งชื่อรอบปีที่จะเก็บเป็นประวัติ (เช่น ปี พ.ศ. หรือ ค.ศ.)", defaultLabel);
                if (label === null) return;
                if (window.confirm(`ยืนยันปิดรอบ "${label}"? ระบบจะบันทึกอันดับปัจจุบันเป็นประวัติ แล้วรีเซ็ตดาว+โทเคนของทุกคนกลับเป็น 0 (รายชื่อคนขับจะไม่หายไป)`)) {
                  onArchiveAndResetYear(label);
                  window.alert(`บันทึกประวัติรอบ "${label}" เรียบร้อย และรีเซ็ตดาว+โทเคนของทุกคนแล้ว`);
                }
              }}
              className="sts-btn w-full py-2 rounded-lg text-sm sts-display"
              style={{ background: "#8A5A00", color: "#FFE9B8" }}
            >
              📚 เก็บประวัติปีนี้ & เริ่มปีใหม่
            </button>
          </div>
        </div>
      )}

      {tab === "demo" && (
        <div className="p-4 space-y-4 sts-fadein">
          <div className="flex items-center justify-between">
            <div className="text-sm sts-display">🎯 เควสกิจกรรม</div>
            <button onClick={openNewQuestForm} className="sts-btn px-3 py-1.5 rounded-lg text-xs flex items-center gap-1" style={{ background: "#FFC531", color: "#0B0D0F" }}>
              <Plus size={14} /> สร้างเควสใหม่
            </button>
          </div>
          <div className="text-xs text-gray-400 leading-relaxed -mt-3">สร้างเควสไว้ล่วงหน้า ตั้งชื่อ เลือกสีดาว และกำหนดจำนวนดาวเอง พอมีคนขับทำสำเร็จ กดมอบดาวให้ได้ทีละหลายคนเลย เสร็จกิจกรรมแล้วกด "เสร็จสิ้นกิจกรรม" เพื่อเก็บเป็นประวัติ</div>
          <button onClick={onBackfillQuestLinks} className="text-xs -mt-2" style={{ color: "#FFC531" }}>
            🔧 นับจำนวนคนได้ดาวไม่ตรง? กดเชื่อมรายการดาวเก่าเข้ากับเควส

function SupervisorView({ drivers, logs, leaderboard, incidents, exit, onBack, theme, onToggleTheme }) {
  const totalStars = logs.reduce((s, l) => s + l.amount, 0);
  const byType = Object.fromEntries(STAR_ORDER.map((k) => [k, logs.filter((l) => l.type === k).reduce((s, l) => s + l.amount, 0)]));
  const topDriver = leaderboard[0];
  const [search, setSearch] = useState("");
  const themeClass = theme === "night" ? "theme-night" : "theme-day";

  const breakdownByDriver = useMemo(() => {
    const map = {};
    drivers.forEach((d) => {
      const t = { total: 0 };
      STAR_ORDER.forEach((k) => (t[k] = 0));
      logs.filter((l) => l.driverId === d.id).forEach((l) => { t[l.type] += l.amount; t.total += l.amount; });
      map[d.id] = t;
    });
    return map;
  }, [drivers, logs]);

  const sortedDrivers = [...drivers]
    .map((d) => ({ ...d, ...(breakdownByDriver[d.id] || { total: 0 }) }))
    .sort((a, b) => b.total - a.total);

  const query = normalizeText(search);
  const filteredDrivers = query
    ? sortedDrivers.filter((d) => normalizeText(d.name).includes(query) || normalizeText(d.plate).includes(query))
    : sortedDrivers;

  return (
    <div className={`min-h-screen sts-light ${themeClass} pb-10`}>
      <TopBarDark title="แผงควบคุมหัวหน้างาน" theme={theme} onToggleTheme={onToggleTheme} right={<React.Fragment><button onClick={onBack} className="text-gray-400 text-sm flex items-center gap-1"><ChevronLeft size={16} />กลับ</button><button onClick={exit} className="text-gray-400 text-sm flex items-center gap-1"><LogOut size={16} />ออก</button></React.Fragment>} />
      <div className="p-4 grid grid-cols-2 gap-3">
        <div className="sts-card-l p-4">
          <Users size={18} className="text-gray-400 mb-1" />
          <div className="text-xs text-gray-400">คนขับทั้งหมด</div>
          <div className="sts-mono sts-display text-2xl">{drivers.length} คน</div>
        </div>
        <div className="sts-card-l p-4">
          <Star size={18} style={{ color: "#FFC531" }} className="mb-1" />
          <div className="text-xs text-gray-400">ดาวทั้งหมด</div>
          <div className="sts-mono sts-display text-2xl">{totalStars} ⭐</div>
        </div>
        {STAR_ORDER.map((k) => {
          const t = STAR_TYPES[k];
          return (
            <div key={k} className="sts-card-l p-4">
              <div className="mb-1">{t.emoji}</div>
              <div className="text-xs text-gray-400">{t.label}</div>
              <div className="sts-mono sts-display text-xl" style={{ color: t.color }}>{byType[k]} ⭐</div>
            </div>
          );
        })}
      </div>
      <div className="px-4 mt-1">
        <div className="text-xs text-gray-500 mb-2 px-1">⚠️ เหตุการณ์ความปลอดภัย — สรุปกระโหลกรายคน (แยกจากระบบดาว)</div>
        <SkullSummaryTable drivers={drivers} incidents={incidents || []} />
      </div>

      {topDriver && (
        <div className="px-4">
          <div className="sts-card-l-raised p-4 mt-2">
            <div className="text-xs text-gray-400 mb-2">🏆 คนขับดาวสูงสุด</div>
            <div className="flex items-center gap-3 mb-3">
              <span className="text-2xl">{DRIVER_AVATAR}</span>
              <div>
                <div className="sts-display text-base">{topDriver.name}</div>
                <div className="text-xs text-gray-500 sts-mono">{topDriver.plate}</div>
              </div>
              <span className="ml-auto sts-mono text-lg" style={{ color: "#FFC531" }}>{topDriver.total} ⭐</span>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {STAR_ORDER.map((k) => {
                const t = STAR_TYPES[k];
                const val = (breakdownByDriver[topDriver.id] || {})[k] || 0;
                return (
                  <span key={k} className="text-xs px-2 py-0.5 rounded-full sts-mono" style={{ background: "var(--input-bg)", color: t.color }}>
                    {t.emoji} {val}
                  </span>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <div className="p-4">
        <div className="text-xs text-gray-500 mb-2 px-1">ดาวของคนขับทุกคน (เรียงจากมากไปน้อย)</div>
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="ค้นหาด้วยชื่อ หรือทะเบียนรถ..."
          className="sts-card-l w-full px-3 py-2 bg-transparent text-sm mb-3"
          style={{ color: "var(--text-primary)" }}
        />
        <div className="space-y-2">
          {filteredDrivers.length === 0 && <div className="text-center text-gray-500 text-sm py-8">ไม่พบรายชื่อ</div>}
          {filteredDrivers.map((d, idx) => (
            <div key={d.id} className="sts-card-l p-3">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-xs text-gray-500 sts-mono" style={{ width: 22, textAlign: "right", display: "inline-block" }}>{idx + 1}</span>
                  <span className="text-xl">{DRIVER_AVATAR}</span>
                  <div>
                    <div className="text-sm">{d.name}</div>
                    <div className="text-xs text-gray-500 sts-mono">{d.plate}</div>
                  </div>
                </div>
                <span className="sts-mono sts-display text-lg" style={{ color: "var(--accent)" }}>{d.total} ⭐</span>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {STAR_ORDER.map((k) => {
                  const t = STAR_TYPES[k];
                  return (
                    <span key={k} className="text-xs px-2 py-0.5 rounded-full sts-mono" style={{ background: "var(--input-bg)", color: t.color }}>
                      {t.emoji} {d[k]}
                    </span>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function normalizeText(s) {
  return String(s || "").replace(/\s+/g, "").toLowerCase();
}

function DriverSearch({ drivers, onEnter, onBack }) {
  const [q, setQ] = useState("");
  const query = normalizeText(q);
  const matches = query.length >= 2
    ? drivers.filter((d) => normalizeText(d.name).includes(query) || normalizeText(d.plate).includes(query)).slice(0, 6)
    : [];

  return (
    <div className="w-full max-w-sm">
